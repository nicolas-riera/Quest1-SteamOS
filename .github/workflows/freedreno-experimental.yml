name: Experimental Freedreno build

on:
  workflow_dispatch:
  push:
    branches: [codex/native-q1-graphics]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Test OTA extraction
        run: python3 -m unittest discover -s tests -v
      - name: Install Mesa build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            bison flex git meson ninja-build pkg-config python3-mako python3-ply \
            libdrm-dev libexpat1-dev libx11-dev libx11-xcb-dev libxext-dev \
            libxdamage-dev libxfixes-dev libxcb-glx0-dev libxcb-dri2-0-dev \
            libxcb-dri3-dev libxcb-present-dev libxcb-randr0-dev libxcb-sync-dev \
            libxcb-shm0-dev libxcb-xfixes0-dev \
            libxshmfence-dev libxxf86vm-dev libxrandr-dev libelf-dev libzstd-dev zlib1g-dev
      - name: Fetch pinned Mesa source
        run: |
          git init "$RUNNER_TEMP/mesa"
          git -C "$RUNNER_TEMP/mesa" remote add origin https://gitlab.freedesktop.org/mesa/mesa.git
          git -C "$RUNNER_TEMP/mesa" fetch --depth=1 origin 769e51468b49b2a42f0a0eaf71cf9eed5ff4e5de
          git -C "$RUNNER_TEMP/mesa" checkout --detach FETCH_HEAD
      - name: Build and stage native Freedreno
        run: sh tools/build-freedreno-experimental.sh "$RUNNER_TEMP/mesa" "$RUNNER_TEMP/mesa-build" "$RUNNER_TEMP/mesa-stage"
      - name: Package experimental build
        run: tar -C "$RUNNER_TEMP/mesa-stage" -czf "$RUNNER_TEMP/freedreno-aarch64-experimental.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: freedreno-aarch64-experimental
          path: ${{ runner.temp }}/freedreno-aarch64-experimental.tar.gz
          retention-days: 7

