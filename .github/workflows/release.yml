# A version tag (v0.0.1, v0.0.2...) builds the Windows installer app and publishes it as a normal release
# (not a prerelease). The app downloads everything else itself (installer/README.md).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with: { go-version: '1.27', cache-dependency-path: app/go.sum }
      - name: Build Quest1-SteamOS.exe
        run: sh app/build.sh "${GITHUB_REF_NAME#v}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd app && sha256sum Quest1-SteamOS.exe > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" Quest1-SteamOS.exe SHA256SUMS.txt \
            --title "Quest1-SteamOS $GITHUB_REF_NAME" --generate-notes
