# The binaries the installer puts on the headset, built from public sources only and published on the
# `prebuilt` branch (one commit, replaced on every build, so the repository's history does not grow with them):
#   native-arm64.tar.zst   our arm64 programs and libraries (tools/build-native.sh), on GitHub's arm64 runner
#   boot-native-holo.img   the boot image (kernel + initrd/), flashed to boot_a/boot_b
#   installer.img          the installer's micro Linux (kernel + Alpine + installer/agent.py), fastboot-booted
#   manifest.json          their sha256 and the commit they were built from
# installer/prepare.py downloads them from there (sources.json "prebuilt").
name: Prebuilt

on:
  push:
    branches: [main]
    paths:
      - src/**
      - initrd/**
      - kernel/**
      - recon/kernel.config
      - tools/build-native.sh
      - tools/build-boot.sh
      - installer/agent.py
      - installer/build_image.py
      - installer/micro-init
      - .github/workflows/prebuilt.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prebuilt
  cancel-in-progress: true

env:
  HOLO_ROOTFS: https://holo-packages.steamos.cloud/holo-core-aarch64-preview/mash-20251118.3/system.rootfs.zst
  HOLO_SHA256: 7e3fb88454e1ac633b7488abb72d3ca0cc7d2578a38146fdd7d58b50fcbd60bf

jobs:
  native:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - name: Holo aarch64 build root
        run: |
          curl -fsSL "$HOLO_ROOTFS" -o rootfs.zst
          echo "$HOLO_SHA256  rootfs.zst" | sha256sum -c
          sudo mkdir -p /holo
          zstd -dc rootfs.zst | sudo tar -xp --xattrs --xattrs-include='*' --numeric-owner -C /holo
          for d in proc sys dev dev/pts src out; do sudo mkdir -p /holo/$d; done
          for d in proc sys dev dev/pts; do sudo mount --bind /$d /holo/$d; done
          sudo mount --bind "$GITHUB_WORKSPACE" /holo/src
          sudo rm -f /holo/etc/resolv.conf
          printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' | sudo tee /holo/etc/resolv.conf >/dev/null
      - name: Build
        run: |
          sudo chroot /holo /usr/bin/env -i PATH=/usr/bin:/usr/sbin HOME=/root \
            /bin/bash /src/tools/build-native.sh /src /out/native-arm64.tar.zst
          mkdir -p dist && cp /holo/out/native-arm64.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with: { name: native, path: dist/ }

  boot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install the build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends bc bison flex libssl-dev \
            device-tree-compiler cpio gcc-aarch64-linux-gnu libc6-dev-arm64-cross unzip zip
      - uses: actions/cache@v4
        id: kernel
        with:
          path: kernel-out
          key: kernel-${{ hashFiles('kernel/quest1-kernel.patch', 'kernel/loop-no-discard-on-ext4.patch', 'kernel/cgroup-events-frozen.patch', 'kernel/lse_emul.c', 'kernel/steamos.config', 'recon/kernel.config', 'tools/build-boot.sh') }}
      - name: Build the kernel
        if: steps.kernel.outputs.cache-hit != 'true'
        run: tools/build-boot.sh kernel "$RUNNER_TEMP/w" kernel-out
      - name: Build the boot and installer images
        run: |
          tools/build-boot.sh image "$RUNNER_TEMP/w" kernel-out dist/boot-native-holo.img
          sudo tools/build-boot.sh installer "$RUNNER_TEMP/w" kernel-out dist/installer.img
      - uses: actions/upload-artifact@v4
        with: { name: boot, path: dist/ }

  publish:
    needs: [native, boot]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Replace the prebuilt branch
        run: |
          cd dist
          python3 - <<'PY'
          import hashlib, json, os
          files = {f: {"size": os.path.getsize(f), "sha256": hashlib.sha256(open(f, "rb").read()).hexdigest()}
                   for f in sorted(os.listdir(".")) if f != "manifest.json"}
          json.dump({"commit": os.environ["GITHUB_SHA"], "files": files}, open("manifest.json", "w"), indent=2)
          PY
          git init -q -b prebuilt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Prebuilt from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" prebuilt
